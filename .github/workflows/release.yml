name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # electron-builder publishes the installers to a GitHub Release itself when
    # GH_TOKEN is set on a tag build. Without contents:write that POST returns
    # 403 "Resource not accessible by integration" and fails the whole step.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: npm run electron:build:linux
            artifact: linux-installers
          - os: windows-latest
            build: npm run electron:build:win
            artifact: windows-installers
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build + package
        run: ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
          if-no-files-found: ignore
